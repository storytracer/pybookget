[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[project]
name = "pybookget"
version = "1.1.0"
description = "A Python tool for downloading digital books from IIIF-compliant libraries"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Sebastian Majstorovic", email = "storytracer@gmail.com"},
]
keywords = ["books", "download", "iiif", "digital-library", "academic", "archives"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

# The core: IIIF parsing (pybookget.formats.iiif) and the HTTP layer (pybookget.http)
dependencies = [
    "httpx>=0.25.0",
    "tqdm>=4.65.0",
    "h2>=4.1.0",  # HTTP/2 support for httpx
    "tenacity>=8.2.0",  # Retry management
    "pyrate-limiter>=4.5,<5",  # Request rate limiting (async); 4.x API
    "fake-useragent>=1.4.0",  # Random user agent generation
]

[project.optional-dependencies]
# The CLI and the book handlers (download_from_url, pybookget.handlers)
cli = [
    "click>=8.0.0",
    "url64>=0.1.0",  # URL-safe base64 encoding
    "tldextract>=5.0.0",  # Extract root domain from URLs
    "rocrate>=0.9.0",  # RO-Crate metadata serialization
]

[project.urls]
Homepage = "https://github.com/storytracer/pybookget"
Repository = "https://github.com/storytracer/pybookget"
Issues = "https://github.com/storytracer/pybookget/issues"

[project.scripts]
pybookget = "pybookget.cli:main"

[dependency-groups]
dev = [
    "pybookget[cli]",
    "pytest>=8",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[tool.uv]
# an older uv may not read a lockfile written by a newer one
required-version = ">=0.13.6"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
